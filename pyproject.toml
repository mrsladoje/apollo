[project]
name = "apollo"
version = "0.1.0"
description = "Apollo — HP Metal Jet S100 Digital Co-Pilot (HackUPC 2026)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "scikit-learn>=1.3",
    "mapie>=1.3",
    "torch>=2.0",
    "deepxde>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]

[project.scripts]
pytest = "apollo_pytest_shim:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["apollo_pytest_shim"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: PLAN-A §10.4 long-running tests (e.g. conformal coverage gate)",
]
