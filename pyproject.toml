[project]
name = "apollo"
version = "0.1.0"
description = "Apollo — HP Metal Jet S100 Digital Co-Pilot (HackUPC 2026)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
